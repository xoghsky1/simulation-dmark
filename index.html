<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>창주집</title>
<meta name="description" content="당산 디마크 거실에서 친구들이랑 소주 한잔">
<meta property="og:title" content="창주집 🍶">
<meta property="og:description" content="링크 열고 이름만 쓰면 거실 입장. 폰/PC 다 됨">
<style>
:root{--bg:#14110f;--panel:rgba(20,17,15,.78);--line:rgba(255,255,255,.14);--text:#f6efe6;--muted:#b9ab9b;--accent:#3fae5a;--accent2:#ffcf5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;pointer-events:none;z-index:5}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#top{top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
#info{padding:8px 12px;font-size:13px;line-height:1.45;pointer-events:auto;max-width:60vw}
#info b{font-size:14px}
#info .sub{color:var(--muted)}
#who{display:none;margin-top:6px;font-size:12px;color:var(--muted);max-height:40vh;overflow:auto}
#info.open #who{display:block}
#topbtns{display:flex;gap:6px;pointer-events:auto}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
button:active{transform:scale(.96)}
#actions{right:calc(10px + env(safe-area-inset-right));bottom:calc(64px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,64px);gap:8px;pointer-events:auto}
#actions button{height:64px;width:64px;padding:4px;border-radius:18px;font-size:12px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#actions button span{font-size:24px}
#joy{left:calc(16px + env(safe-area-inset-left));bottom:calc(70px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;pointer-events:auto;touch-action:none;display:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.4)}
body.touch #joy{display:block}
#chatlog{left:10px;bottom:calc(64px + env(safe-area-inset-bottom));width:min(70vw,360px);display:flex;flex-direction:column;gap:4px;font-size:13px}
body.touch #chatlog{bottom:calc(210px + env(safe-area-inset-bottom));width:min(58vw,360px)}
#chatlog div{background:rgba(0,0,0,.45);padding:4px 9px;border-radius:10px;width:fit-content;max-width:100%;word-break:break-all;transition:opacity 1s}
#chatlog div b{margin-right:6px}
#chatlog div.sys{color:var(--muted);font-size:12px}
#chatbar{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;pointer-events:auto;max-width:520px}
#chatbar input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;outline:none}
#chatbar input:focus{border-color:var(--accent)}
#toast{left:50%;top:30%;transform:translateX(-50%);padding:10px 16px;font-size:15px;opacity:0;transition:opacity .3s;white-space:nowrap}
#toast.show{opacity:1}
#net{left:50%;top:calc(56px + env(safe-area-inset-top));transform:translateX(-50%);padding:6px 12px;font-size:12px;display:none;color:var(--accent2)}
#help{top:calc(60px + env(safe-area-inset-top));right:10px;padding:10px 12px;font-size:12px;line-height:1.6;color:var(--muted);max-width:250px;display:none}
#help.show{display:block}
#gate{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#3a2a1c 0%,#120e0b 70%);padding:16px}
#gate .card{width:100%;max-width:360px;padding:24px 20px;text-align:center}
#gate h1{margin:6px 0 4px;font-size:24px}
#gate p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5}
#gate input{width:100%;font:inherit;font-size:18px;text-align:center;color:var(--text);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;margin-bottom:12px}
#gate .colors{display:flex;justify-content:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
#gate .colors b{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}
#gate .colors b.on{border-color:#fff}
#gate button.go{width:100%;background:var(--accent);border:0;font-size:17px;font-weight:700;padding:13px;color:#fff}
#gate .bottle{font-size:44px}
#gate small{display:block;margin-top:12px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<div id="top" class="hud">
  <div id="info" class="panel">
    <b>🍶 디마크 당산 · 거실</b><br>
    <span class="sub" id="count">연결 중…</span><br>
    <span class="sub" id="total"></span>
    <div id="who"></div>
  </div>
  <div id="topbtns">
    <button id="invite">🔗 초대</button>
    <button id="helpbtn">❔</button>
  </div>
</div>
<div id="help" class="hud panel">
  <b style="color:var(--text)">조작법</b><br>
  PC: WASD/방향키 이동 · 마우스 드래그 시점 · 휠 줌 · Enter 채팅<br>
  폰: 왼쪽 조이스틱 이동 · 화면 드래그 시점 · 두 손가락 줌<br>
  바닥을 톡 누르면 거기로 걸어가요. 방석이나 소파를 누르면 가서 앉아요.<br>
  단축키: 1 따르기 · 2 짠 · 3 원샷 · E 앉기
</div>
<div id="net" class="hud panel">서버에 다시 연결하는 중…</div>
<div id="chatlog" class="hud"></div>
<div id="joy" class="hud panel"><i></i></div>
<div id="actions" class="hud">
  <button id="aPour"><span>🍶</span>따르기</button>
  <button id="aCheers"><span>🥂</span>짠!</button>
  <button id="aShot"><span>🥃</span>원샷</button>
  <button id="aSit"><span>🪑</span>앉기</button>
</div>
<form id="chatbar" class="hud" autocomplete="off">
  <input id="chatin" maxlength="120" placeholder="메시지 (Enter)" enterkeyhint="send">
  <button type="submit">전송</button>
</form>
<div id="toast" class="hud panel"></div>

<div id="gate">
  <div class="card panel">
    <div class="bottle">🍶</div>
    <h1>디마크 술자리</h1>
    <p>당산 디마크 거실에 상 펴놨어요.<br>이름 쓰고 들어오세요.</p>
    <input id="nameIn" maxlength="12" placeholder="이름 (예: 태호)" autocomplete="nickname" enterkeyhint="go">
    <div class="colors" id="colors"></div>
    <button class="go" id="enter">입장하기</button>
    <small id="gateNote">최대 20명 · 설치 없이 폰/PC 브라우저</small>
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "@supabase/supabase-js":"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { createClient } from '@supabase/supabase-js';

/* 집 구조 설정 — 숫자만 바꾸면 방 크기/배치가 바뀝니다 (단위: 미터) */
const HOUSE = {
  // 디마크당산(도시형) 20A-2평 평면도 기준 · 전용 14.04평(약 46㎡) · 방2 / 욕실1 · 드레스룸 · 테라스

  W: 9.8, D: 8.11, H: 2.4,
  // 바닥 구역 [x0,z0,x1,z1, 종류]  (wood/tile/entry/deck)
  floors: [
    [3.08,0, 8.08,5.57,'wood'],   // 주방 + 거실
    [8.08,1.97, 8.28,3.31,'wood'],// 거실→현관 통로

    [8.28,1.5, 9.8,3.31,'entry'], // 현관

  ],
  // 벽 [x1,z1,x2,z2, 높이?]  — 문은 벽을 끊어서 표현
  walls: [
    [3.08,0, 5.91,0],                  // 주방 윗벽
    [5.91,0, 8.28,0], [8.28,0, 8.28,1.5], // 욕실 윗벽/오른벽
    [5.91,1.97, 7.04,1.97], [7.57,1.97, 8.28,1.97], // 욕실 아랫벽 (문 7.04~7.57)
    [6.77,0, 6.77,1.1],                // 샤워 파티션

    [0,5.57, 3.6,5.57], [4.5,5.57, 8.08,5.57], // 거실/침실1 아랫벽 (침실2 문 3.6~4.5)
    [3.08,0, 3.08,3.5], [3.08,4.5, 3.08,5.57], // 주방·거실|침실1 (침실1 문 z 3.5~4.5)
    [0,1.75, 1.5,1.75], [1.5,0.84, 1.5,1.75], [1.5,0.84, 2.45,0.84], [2.45,0.84, 2.45,3.17], [0,1.75, 0,3.17], // 드레스룸
    [0,3.17, 1.6,3.17], [2.3,3.17, 3.08,3.17], // 드레스룸|침실1 (문 1.6~2.3)
    [0,3.17, 0,5.57],                  // 침실1 왼벽
    [2.64,5.57, 2.64,5.9], [2.64,6.8, 2.64,8.11], // 침실2|테라스 (문 z 5.9~6.8)
    [5.53,5.57, 5.53,8.11], [2.64,8.11, 5.53,8.11], // 침실2 오른벽/아랫벽
    [0,5.57, 0,8.11, 1.0], [0,8.11, 2.64,8.11, 1.0], // 테라스 난간
  ],
  solids: [ [5.37,0, 5.91,1.97], [2.45,0.84, 3.08,3.17], [2.64,7.35, 3.2,8.11] ], // 기둥·붙박이장·덕트
  // 창문: 벽선 위 [x1,z1,x2,z2, 아래높이, 위높이]
  windows: [
    [3.24,0, 4.9,0, 1.0,2.1],       // 주방 창
    [5.77,5.57, 7.77,5.57, 0.3,2.15],// 거실 큰 창 (야경)
    [0.3,1.75, 1.3,1.75, 0.9,2.0],  // 드레스룸 창
    [0,1.9, 0,3.0, 0.9,2.0],
    [3.37,8.11, 5.1,8.11, 0.8,2.1], // 침실2 창
    [0,3.6, 0,5.2, 0.8,2.1],        // 침실1 창
  ],
  table: { x: 5.35, z: 3.95, w: 1.5, d: 0.85, h: 0.36 },  // 거실 좌식 술상
  spawn: { x: 9.0, z: 2.85, ry: -Math.PI/2 },               // 현관에서 시작
};
// 집 전체 확대 배율 (1 = 평면도 실측). 가구 크기는 그대로, 방만 넓어짐
const SCALE = 1.3;
(function scaleHouse(S){
  HOUSE.W*=S; HOUSE.D*=S; HOUSE.H=2.5;
  for (const a of [HOUSE.floors, HOUSE.walls, HOUSE.solids, HOUSE.windows]) for (const r of a) for (let i=0;i<4;i++) r[i]*=S;
  HOUSE.table.x*=S; HOUSE.table.z*=S; HOUSE.spawn.x*=S; HOUSE.spawn.z*=S;
})(SCALE);
const MAX_PLAYERS = 20;
const SUPABASE_URL = 'https://jzouvtpwibgmlenwbial.supabase.co';
const SUPABASE_KEY = 'sb_publishable_QmjuXAtq6ghgQ-7MCawKuQ_xiR5Icl4';
const ROOM = (new URLSearchParams(location.search).get('room') || 'dmark').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,32) || 'dmark';

/* ---------------- 유틸 ---------------- */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const num = (v, d=0) => (typeof v === 'number' && Number.isFinite(v)) ? v : d;
const COLORS = ['#e8594f','#f29a38','#f5cd3d','#5cc26a','#3fb7c9','#4f7fe8','#9a66e0','#e86bb3','#8d6e5c','#e0e0e0'];
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
let myId; try { myId = sessionStorage.getItem('dm_id'); } catch {}
if (!myId) { myId = Math.random().toString(36).slice(2,10); try { sessionStorage.setItem('dm_id', myId); } catch {} }

let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------------- 렌더러/씬 ---------------- */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isTouch, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.75 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0c0b10');
const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 60);
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov = w<h ? 72 : 60; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

scene.add(new THREE.HemisphereLight('#ffe9d0', '#3b2a20', 0.9));
const lamp = new THREE.PointLight('#ffc98a', 18, 9, 1.6); lamp.position.set(HOUSE.table.x, 2.3, HOUSE.table.z); scene.add(lamp);
const lamp2 = new THREE.PointLight('#ffe2bd', 6, 6, 1.8); lamp2.position.set(4.2*SCALE, 2.3, 1.0*SCALE); scene.add(lamp2);
const lamp3 = new THREE.PointLight('#fff1dc', 5, 6, 1.8); lamp3.position.set(1.5*SCALE, 2.3, 4.3*SCALE); scene.add(lamp3);
const lamp4 = new THREE.PointLight('#fff1dc', 5, 6, 1.8); lamp4.position.set(4.1*SCALE, 2.3, 6.8*SCALE); scene.add(lamp4);
const lamp5 = new THREE.PointLight('#fff4e6', 3, 4, 1.8); lamp5.position.set(8.6*SCALE, 2.3, 2.4*SCALE); scene.add(lamp5);

function canvasTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); draw(g,w,h); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t; }
const mat = (color, opts={}) => new THREE.MeshLambertMaterial({ color, ...opts });

/* 바닥 (원목/타일) */
const woodTex = canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#b98a5c'; g.fillRect(0,0,w,h);
  const plank=64;
  for(let y=0;y<h;y+=plank){ const off=(y/plank%2)*180;
    for(let x=-off;x<w;x+=360){ const l=72+Math.random()*26; g.fillStyle=`hsl(30,${40+Math.random()*10}%,${l*0.55}%)`; g.fillRect(x+1,y+1,358,plank-2);
      g.strokeStyle='rgba(60,35,15,.16)'; for(let i=0;i<5;i++){ g.beginPath(); const yy=y+6+Math.random()*(plank-12); g.moveTo(x,yy); g.bezierCurveTo(x+120,yy+4,x+240,yy-4,x+360,yy); g.stroke(); } } }
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;
const tileTex = (base,line,n=4)=>{ const t=canvasTex(128,128,(g)=>{ g.fillStyle=base; g.fillRect(0,0,128,128); g.strokeStyle=line; g.lineWidth=2; for(let i=0;i<=128;i+=128/n){ g.beginPath(); g.moveTo(i,0); g.lineTo(i,128); g.moveTo(0,i); g.lineTo(128,i); g.stroke(); } }); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t; };
const FLOOR_TEX = { wood: woodTex, tile: tileTex('#d3dde2','#9aa5ab'), entry: tileTex('#8f8a85','#6b6661',3), deck: tileTex('#efe6d6','#cbbfa9',4) };
const FLOOR_REP = { wood: 2.5, tile: 0.8, entry: 0.9, deck: 1.2 };
const floorMeshes = [];
for (const [x0,z0,x1,z1,kind] of HOUSE.floors){
  const w=x1-x0, d=z1-z0; const tex=FLOOR_TEX[kind].clone(); tex.needsUpdate=true; tex.repeat.set(w/FLOOR_REP[kind], d/FLOOR_REP[kind]);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d), mat('#ffffff',{map:tex})); m.rotation.x=-Math.PI/2; m.position.set(x0+w/2, kind==='wood'?0:0.004, z0+d/2); m.userData.floor=true; scene.add(m); floorMeshes.push(m);
  if (kind!=='deck'){ const c=new THREE.Mesh(new THREE.PlaneGeometry(w,d), new THREE.MeshLambertMaterial({color:'#f3eee6'})); c.rotation.x=Math.PI/2; c.position.set(x0+w/2,HOUSE.H,z0+d/2); scene.add(c); }
}
// 바깥 (테라스 밖 / 창밖 어둠 바닥)
{ const g=new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshBasicMaterial({color:'#0d0d14'})); g.rotation.x=-Math.PI/2; g.position.set(HOUSE.W/2,-3,HOUSE.D/2); scene.add(g); }

/* 벽 + 충돌 박스 */
const colliders = []; // {x0,z0,x1,z1}
const wallMeshes = [];
const wallMat = mat('#ece4d8');
const T = 0.12;
function addBox(x0,z0,x1,z1){ colliders.push({x0:Math.min(x0,x1),z0:Math.min(z0,z1),x1:Math.max(x0,x1),z1:Math.max(z0,z1)}); }
const railMat = new THREE.MeshPhongMaterial({color:'#bfe0ff', transparent:true, opacity:.25});
for (const [x1,z1,x2,z2,hh] of HOUSE.walls){
  const h = hh || HOUSE.H; const len = Math.hypot(x2-x1,z2-z1); const horiz = Math.abs(z2-z1) < 1e-6;
  const geo = new THREE.BoxGeometry(horiz?len+T:T, h, horiz?T:len+T);
  const m = new THREE.Mesh(geo, hh ? railMat : wallMat); m.position.set((x1+x2)/2, h/2, (z1+z2)/2); scene.add(m); if (!hh) wallMeshes.push(m);

function textSprite(lines, opts={}){
  const font = opts.font || 'bold 30px "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
  const c=document.createElement('canvas'); const g=c.getContext('2d'); g.font=font;
  const lh = opts.lh || 38; const pad=14;
  const wmax = Math.max(...lines.map(l=>g.measureText(l).width));
  c.width = Math.ceil(wmax+pad*2); c.height = Math.ceil(lh*lines.length+pad*1.3);
  g.font=font; g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle = opts.bg || 'rgba(15,12,10,.72)';
  const r=18; g.beginPath(); g.roundRect ? g.roundRect(0,0,c.width,c.height,r) : g.rect(0,0,c.width,c.height); g.fill();
  if (opts.tail){ g.beginPath(); }
  g.fillStyle = opts.color || '#fff';
  lines.forEach((l,i)=>g.fillText(l, c.width/2, pad*0.65+lh*(i+0.5)));
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t, depthTest:false, transparent:true}));
  const scale = opts.scale || 0.0042; s.scale.set(c.width*scale, c.height*scale, 1); s.renderOrder = 10;
  return s;
}

const floaters=[];

/* ---------------- 오디오 (짠 소리) ---------------- */
let actx;
function audio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch{} } if(actx&&actx.state==='suspended') actx.resume(); return actx; }
function clink(vol=0.35){ const a=audio(); if(!a) return; const t=a.currentTime;
  for (const [f,dl] of [[2350,0],[3120,0.004],[2600,0.09],[3480,0.094]]){ const o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t+dl); g.gain.exponentialRampToValueAtTime(vol*0.5,t+dl+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+dl+0.5); o.connect(g).connect(a.destination); o.start(t+dl); o.stop(t+dl+0.55); } }
function glug(){ const a=audio(); if(!a) return; const t=a.currentTime;
  for (let i=0;i<4;i++){ const o=a.createOscillator(), g=a.createGain(); o.type='triangle'; const s=t+i*0.12; o.frequency.setValueAtTime(260+i*40,s); o.frequency.exponentialRampToValueAtTime(140,s+0.09); g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(0.2,s+0.01); g.gain.exponentialRampToValueAtTime(0.0001,s+0.1); o.connect(g).connect(a.destination); o.start(s); o.stop(s+0.12); } }
function gulp(){ const a=audio(); if(!a) return; const t=a.currentTime; const o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(90,t+0.18); g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22); o.connect(g).connect(a.destination); o.start(t); o.stop(t+0.25); }

/* ---------------- 빈 병 (다 같이 마신 양) ---------------- */
const emptyBottles = [];
function updateEmpties(total){
  const n = Math.min(16, Math.floor(total/EMPTY_BOTTLES_PER));
  while (emptyBottles.length < n){ const i=emptyBottles.length; const b=makeBottle(); b.rotation.z=Math.PI/2; b.rotation.y = (i*1.7)%Math.PI;
    const side = i%2? 1:-1; b.position.set(TB.x + side*(TB.w/2+0.05) - side*0.0 + (Math.floor(i/2)%2)*0.1*side, 0.04, TB.z - 0.35 + Math.floor(i/4)*0.12 + (i%2)*0.05); scene.add(b); emptyBottles.push(b); }
  while (emptyBottles.length > n){ scene.remove(emptyBottles.pop()); }
}

/* ---------------- 충돌 ---------------- */
const R = 0.22;
function collide(x,z){
  x = clamp(x, R, HOUSE.W-R); z = clamp(z, R, HOUSE.D-R);
  for (let k=0;k<2;k++) for (const b of colliders){
    const cx=clamp(x,b.x0,b.x1), cz=clamp(z,b.z0,b.z1); const dx=x-cx, dz=z-cz; const d2=dx*dx+dz*dz;
    if (d2 < R*R){ if (d2>1e-9){ const d=Math.sqrt(d2); x=cx+dx/d*R; z=cz+dz/d*R; }
      else { const opts=[[b.x0-R-x,0],[b.x1+R-x,0],[0,b.z0-R-z],[0,b.z1+R-z]]; opts.sort((a,b2)=>Math.hypot(...a)-Math.hypot(...b2)); x+=opts[0][0]; z+=opts[0][1]; } }
  }
  return [x,z];
}

/* ---------------- 상태 ---------------- */
let me = null; const others = new Map(); // id -> {av, net}
const SPEED = 2.0;
const input = { x:0, z:0, keys:new Set() };
let target = null; // {x,z,seat}
let stuckT = 0;
let camYaw = Math.PI, camPitch = 0.42, camDist = 3.2;

function seatTakenBy(i){ if (me && me.sit===i) return myId; for (const [id,o] of others) if (o.av.sit===i) return id; return null; }
function nearestFreeSeat(x,z,cushionOnly=false){ let best=-1, bd=1e9; seats.forEach((s,i)=>{ if (seatTakenBy(i) || (cushionOnly && s.kind!=='cushion')) return; const d=Math.hypot(s.x-x,s.z-z); if (d<bd){bd=d;best=i;} }); return best; }
function standUp(){ if (me.sit>=0){ const s=seats[me.sit]; me.sit=-1; const away = s.kind==='sofa' ? [-0.6,0] : [Math.sin(s.ry)*-0.45, Math.cos(s.ry)*-0.45]; [me.x,me.z]=collide(s.x+away[0], s.z+away[1]); sendMove(true); } }
function goTo(x,z,seat=-1){ if (me.sit>=0) standUp(); target={x,z,seat}; sendMove(true); }
function sitAt(i){ const s=seats[i]; if (!s) return; if (seatTakenBy(i) && seatTakenBy(i)!==myId){ toast('누가 앉아 있어요'); return; } goTo(s.x, s.z, i); }

/* ---------------- 네트워크 ---------------- */
let channel = null, online = false;
let lastSend = 0, lastTrack = 0, trackTimer = null, wasMoving = false;
function sendInterval(){ const n = others.size + 1; return clamp(n*n*0.3/60, 0.15, 2.0) * 1000; }
function send(event, payload){ if (!channel || !online) return; channel.send({ type:'broadcast', event, payload: { ...payload, id: myId } }).catch(()=>{}); }
function myState(){ return { name: me.name, color: me.color, x: +me.x.toFixed(2), z: +me.z.toFixed(2), ry: +me.ry.toFixed(2), sit: me.sit, drinks: me.drinks, fill: me.fill }; }
function sendMove(force=false){
  const now=performance.now(); if (!force && now-lastSend < sendInterval()) return; lastSend=now;
  const p = { x:+me.x.toFixed(2), z:+me.z.toFixed(2), ry:+me.ry.toFixed(2), vx:+(me.vx||0).toFixed(2), vz:+(me.vz||0).toFixed(2), sit:me.sit };
  if (target){ p.tx=+target.x.toFixed(2); p.tz=+target.z.toFixed(2); p.ts=target.seat; }
  send('mv', p); scheduleTrack();
}
function scheduleTrack(){ // presence는 30초에 5번 제한 → 7초 간격으로 최신 상태만
  if (trackTimer) return; const wait = Math.max(0, 7000 - (performance.now()-lastTrack));
  trackTimer = setTimeout(()=>{ trackTimer=null; if (!channel || !online) return; lastTrack=performance.now(); channel.track(myState()).catch(()=>{}); }, wait + 300);
}
function getOther(id, st={}){
  let o = others.get(id);
  if (!o){ const name = String(st.name||'손님').slice(0,12); const color = COLORS.includes(st.color)? st.color : COLORS[0];
    o = { av: new Avatar(id, name, color), net: null, target: null, lastSeen: performance.now() };
    if (st.x!=null){ o.av.x=clamp(num(st.x),0,HOUSE.W); o.av.z=clamp(num(st.z),0,HOUSE.D); o.av.ry=num(st.ry); }
    others.set(id,o); }
  return o;
}
function applyPresence(){
  if (!channel) return; const ps = channel.presenceState(); const seen = new Set();
  for (const key in ps){ const metas = ps[key]; if (!metas || !metas.length || key===myId) continue; const st = metas[metas.length-1]; seen.add(key);
    const isNew = !others.has(key); const o = getOther(key, st);
    o.av.setName(String(st.name||'손님').slice(0,12)); o.av.setDrinks(Math.max(o.av.drinks, num(st.drinks))); if (isNew) o.av.setFill(st.fill);
    if (isNew){ o.av.sit = Number.isInteger(st.sit) && seats[st.sit] ? st.sit : -1; if (o.av.sit>=0){ o.av.x=seats[o.av.sit].x; o.av.z=seats[o.av.sit].z; o.av.ry=seats[o.av.sit].ry; } }
    else if (!o.net && !o.target){ o.av.sit = Number.isInteger(st.sit) && seats[st.sit] ? st.sit : -1; }
    if (isNew && joinedAt && performance.now()-joinedAt > 2500) sys(`${o.av.name} 님이 들어왔어요 🙌`);
  }

let joinedAt = 0;
function connect(){
  let sb;

  catch(e){ console.error(e); $('count').textContent='서버 연결 실패 (혼자 모드)'; return; }
  channel = sb.channel('dmark-hangout-'+ROOM, { config: { broadcast: { self:false, ack:false }, presence: { key: myId } } });

    if (!p || p.id===myId || typeof p.id!=='string') return; const o=getOther(p.id); o.lastSeen=performance.now();

    if (p.tx!=null){ o.target={ x:clamp(num(p.tx),0,HOUSE.W), z:clamp(num(p.tz),0,HOUSE.D), seat: Number.isInteger(p.ts)&&seats[p.ts]?p.ts:-1 }; o.net=null; o.av.sit=-1;
      if (Math.hypot(o.av.x-x,o.av.z-z)>1.2){ o.av.x=x; o.av.z=z; } }
    else { o.target=null; o.net={ x, z, vx:clamp(num(p.vx),-3,3), vz:clamp(num(p.vz),-3,3), ry:num(p.ry), t:performance.now() };
      o.av.sit = Number.isInteger(p.sit)&&seats[p.sit] ? p.sit : -1; if (o.av.sit>=0){ o.av.x=seats[o.av.sit].x; o.av.z=seats[o.av.sit].z; o.av.ry=seats[o.av.sit].ry; o.net=null; } }
  });

    if (status==='SUBSCRIBED'){ online=true; $('net').style.display='none'; if (!joinedAt) joinedAt=performance.now(); lastTrack=performance.now(); try { await channel.track(myState()); } catch {} send('mv',{x:me.x,z:me.z,ry:me.ry,vx:0,vz:0,sit:me.sit}); updateHUD();
      setTimeout(()=>{ if (others.size+1 > MAX_PLAYERS) toast(`지금 ${others.size+1}명이라 좀 버벅일 수 있어요`); }, 2000); }
    else if (status==='CHANNEL_ERROR' || status==='TIMED_OUT' || status==='CLOSED'){ online=false; $('net').style.display='block'; updateHUD(); }
  });

/* ---------------- 액션: 따르기/짠/원샷 ---------------- */
function doActEffect(av, type, p, mine){
  const near = me && Math.hypot(av.x-me.x, av.z-me.z) < 4;
  if (type==='pour'){ av.setFill(1); av.pop('🍶 쪼르륵','#bff5c8'); if (mine||near) glug(); }
  else if (type==='cheers'){ av.raise=1.2; av.pop('짠! 🥂'); if (mine||near) clink(mine?0.4:0.25); }
  else if (type==='shot'){ av.setFill(0); av.raise=1.0; if (p && p.d!=null) av.setDrinks(p.d); av.pop(['캬~','크으','원샷!','한 잔 더'][Math.floor(Math.random()*4)],'#ffffff'); if (mine||near) gulp(); updateHUD(); }
}
function act(type){
  if (!me) return; audio();
  if (type==='pour'){ if (me.fill>0.9){ toast('잔 이미 가득 찼어요'); return; } doActEffect(me,'pour',null,true); send('act',{type:'pour'}); }
  else if (type==='cheers'){ doActEffect(me,'cheers',null,true); send('act',{type:'cheers'});
    const n=[...others.values()].filter(o=>Math.hypot(o.av.x-me.x,o.av.z-me.z)<2.6).length; if (n) toast(`${n}명이랑 짠! 🥂`); }
  else if (type==='shot'){ if (me.fill<0.1){ toast('잔이 비었어요. 먼저 따르세요 🍶'); return; } me.setDrinks(me.drinks+1); doActEffect(me,'shot',{d:me.drinks},true); send('act',{type:'shot', d:me.drinks}); store.set('dm_drinks_'+new Date().toDateString(), String(me.drinks)); }
  scheduleTrack();
}
$('aPour').onclick=()=>act('pour'); $('aCheers').onclick=()=>act('cheers'); $('aShot').onclick=()=>act('shot');

// 조이스틱
{ const joy=$('joy'), knob=joy.querySelector('i'); let pid=null;

{ const pts=new Map(); let downAt=null, pinch0=0, dist0=0;

    if (pts.size===1){ camYaw -= dx*0.006; camPitch = clamp(camPitch + dy*0.005, 0.05, 1.25); if (downAt && Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)>8) downAt.moved=true; }
    else if (pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if (pinch0>0) camDist=clamp(dist0*pinch0/d,1.0,7); } });
  const up=e=>{ if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
    if (pts.size===0 && downAt && !downAt.moved && performance.now()-downAt.t<400 && me){
      const r=canvas.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera);
      const hitSeat = ray.intersectObjects(seatMeshes,false)[0];
      if (hitSeat){ sitAt(hitSeat.object.userData.seat); }
      else { const hit=ray.intersectObjects([...floorMeshes, ...wallMeshes],false)[0]; if (hit && hit.object.userData.floor){ const [x,z]=collide(hit.point.x,hit.point.z); goTo(x,z,-1); marker.position.set(x,0.02,z); marker.visible=true; markerT=1; } }
    }
    if (pts.size===0) downAt=null; };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', e=>{ e.preventDefault(); camDist=clamp(camDist*(1+Math.sign(e.deltaY)*0.1),1.0,7); }, {passive:false});
  canvas.addEventListener('contextmenu', e=>e.preventDefault());
}
const marker=new THREE.Mesh(new THREE.RingGeometry(0.12,0.17,24), new THREE.MeshBasicMaterial({color:'#7dffa0',transparent:true})); marker.rotation.x=-Math.PI/2; marker.visible=false; scene.add(marker); let markerT=0;

/* ---------------- 입장 화면 ---------------- */
{ const cwrap=$('colors'); let pick = store.get('dm_color'); if (!COLORS.includes(pick)) pick = COLORS[Math.floor(Math.random()*COLORS.length)];
  COLORS.forEach(c=>{ const b=document.createElement('b'); b.style.background=c; if (c===pick) b.classList.add('on'); b.onclick=()=>{ pick=c; [...cwrap.children].forEach(x=>x.classList.toggle('on',x===b)); }; cwrap.appendChild(b); });
  $('nameIn').value = store.get('dm_name') || '';
  const enter=()=>{ const name=$('nameIn').value.trim().slice(0,12); if (!name){ $('nameIn').focus(); $('gateNote').textContent='이름을 써주세요 🙏'; return; }
    store.set('dm_name',name); store.set('dm_color',pick); audio();
    me = new Avatar(myId, name, pick); me.vx=0; me.vz=0;
    const d = parseInt(store.get('dm_drinks_'+new Date().toDateString())||'0',10); if (d>0) me.setDrinks(d);
    camYaw = HOUSE.spawn.ry+Math.PI; $('gate').remove(); updateHUD(); connect();
    sys('바닥을 누르면 걸어가고, 방석을 누르면 앉아요. 🍶 따르고 🥂 짠!');
    setTimeout(()=>{ if (me.sit<0 && !target){ const i=nearestFreeSeat(me.x,me.z,true); if (i>=0) sitAt(i); } }, 2200);
  };
  $('enter').onclick=enter; $('nameIn').addEventListener('keydown',e=>{ if (e.key==='Enter') enter(); });
}

/* ---------------- 루프 ---------------- */
const clock=new THREE.Clock(); const camTarget=new THREE.Vector3(); const camRay=new THREE.Raycaster();
camera.position.set(HOUSE.table.x, 1.8, 5.2); camera.lookAt(HOUSE.table.x, 0.6, HOUSE.table.z);
function step(){
  const dt=Math.min(0.05, clock.getDelta()), t=clock.elapsedTime;
  if (me){
    // 입력 → 이동 (카메라 기준)
    let ix=input.x, iz=input.z; const K=input.keys;
    if (K.has('w')||K.has('arrowup')) iz-=1; if (K.has('s')||K.has('arrowdown')) iz+=1; if (K.has('a')||K.has('arrowleft')) ix-=1; if (K.has('d')||K.has('arrowright')) ix+=1;
    const m=Math.hypot(ix,iz); let vx=0, vz=0;
    if (m>0.15){ if (me.sit>=0) standUp(); target=null; const s=Math.min(1,m)/m; ix*=s; iz*=s;
      const sin=Math.sin(camYaw), cos=Math.cos(camYaw);
      vx = (ix*cos + iz*sin)*SPEED; vz = (-ix*sin + iz*cos)*SPEED; }
    else if (target){ const dx=target.x-me.x, dz=target.z-me.z, d=Math.hypot(dx,dz);
      if (d<0.06 || (d<0.35 && target.seat>=0)){ if (target.seat>=0){ const s=seats[target.seat]; if (!seatTakenBy(target.seat)){ me.sit=target.seat; me.x=s.x; me.z=s.z; me.ry=s.ry; camYaw=s.ry+Math.PI; camPitch=Math.max(camPitch,0.5); target=null; } else { const j=nearestFreeSeat(me.x,me.z); target = j>=0 ? {x:seats[j].x,z:seats[j].z,seat:j} : null; if (j<0) toast('빈 자리가 없어요'); } } else target=null; sendMove(true); updateHUD(); }
      else { const sp=Math.min(SPEED, d/dt); vx=dx/d*sp; vz=dz/d*sp; } }
    if (vx||vz){ const sx=target&&target.seat>=0; const nx=me.x+vx*dt, nz=me.z+vz*dt;
      if (sx && Math.hypot(target.x-me.x,target.z-me.z)<0.6){ me.x=nx; me.z=nz; } else { const px=me.x, pz=me.z; [me.x,me.z]=collide(nx,nz); if (target){ if (Math.hypot(me.x-px,me.z-pz) < Math.hypot(vx,vz)*dt*0.25) stuckT+=dt; else stuckT=Math.max(0,stuckT-dt); if (stuckT>0.8){ stuckT=0; if (target.seat>=0){ const s=seats[target.seat]; me.x=s.x; me.z=s.z; } else target=null; } } }
      me.ry=Math.atan2(vx,vz); }
    me.vx=vx; me.vz=vz; me.moving = !!(vx||vz);
    if (me.moving) sendMove(false); else if (wasMoving) sendMove(true);
    wasMoving = me.moving;
    me.tick(dt,t);
  }
  for (const o of others.values()){
    const av=o.av;
    if (o.target){ const dx=o.target.x-av.x, dz=o.target.z-av.z, d=Math.hypot(dx,dz);
      if (d<0.05){ if (o.target.seat>=0){ const s=seats[o.target.seat]; av.sit=o.target.seat; av.x=s.x; av.z=s.z; av.ry=s.ry; } o.target=null; av.moving=false; }
      else { const sp=Math.min(SPEED*dt,d); av.x+=dx/d*sp; av.z+=dz/d*sp; av.ry=Math.atan2(dx,dz); av.moving=true; } }
    else if (o.net){ const n=o.net; const age=Math.min((performance.now()-n.t)/1000, sendInterval()/1000*1.3); const px=n.x+n.vx*age, pz=n.z+n.vz*age;
      const k=Math.min(1,dt*8); av.x+=(px-av.x)*k; av.z+=(pz-av.z)*k; const mv=Math.hypot(n.vx,n.vz)>0.05; av.moving=mv; av.ry = mv ? Math.atan2(n.vx,n.vz) : n.ry; }
    else av.moving=false;
    av.tick(dt,t);
  }
  for (let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.t+=dt; f.s.position.y=1.5+f.t*0.6; f.s.material.opacity=1-f.t/1.4; if (f.t>1.4){ f.parent.remove(f.s); f.s.material.map.dispose(); f.s.material.dispose(); floaters.splice(i,1); } }
  if (markerT>0){ markerT-=dt; marker.material.opacity=markerT; if (markerT<=0) marker.visible=false; }

  // 카메라
  if (me){
    const headY = me.sit>=0 ? (seats[me.sit].kind==='sofa'?1.0:0.85) : 1.35;
    camTarget.set(me.x, headY, me.z);
    const wob = me.drinks>7 ? Math.sin(t*0.9)*Math.min(me.drinks-7,12)*0.004 : 0;
    const dir=new THREE.Vector3(Math.sin(camYaw)*Math.cos(camPitch), Math.sin(camPitch), Math.cos(camYaw)*Math.cos(camPitch));
    let dist=camDist; camRay.set(camTarget, dir); camRay.far=camDist; const hit=camRay.intersectObjects(wallMeshes,false)[0]; if (hit) dist=Math.max(0.05, hit.distance-0.18); me.g.visible = dist > 0.8;
    const pos=camTarget.clone().addScaledVector(dir,dist); if (pos.y>HOUSE.H-0.12){ pos.y=HOUSE.H-0.12; }
    camera.position.lerp(pos, Math.min(1, dt*12)); camera.lookAt(camTarget.x, camTarget.y-0.1, camTarget.z); camera.rotation.z += wob;
  } else { const a=t*0.08; camera.position.set(TB.x+Math.sin(a)*2.6, 1.7, TB.z+Math.cos(a)*2.6); camera.lookAt(TB.x,0.5,TB.z); }
  if (location.hash==='#top'){ camera.position.set(HOUSE.W/2, 13, HOUSE.D/2+0.01); camera.lookAt(HOUSE.W/2,0,HOUSE.D/2); }
  renderer.render(scene,camera);
  requestAnimationFrame(step);
}
requestAnimationFrame(step);
setInterval(updateHUD, 3000);
window.__dm = { get me(){return me;}, others, seats, act };
</script>
